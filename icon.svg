<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#305669" />
      <stop offset="100%" stop-color="#1F3845" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C1785A" />
      <stop offset="100%" stop-color="#D98A6C" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7E5CD" />
      <stop offset="100%" stop-color="#8ABEB9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E172B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Soft Decorative Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(183, 229, 205, 0.15)" stroke-width="6" stroke-dasharray="16 12" />

  <!-- Main Symbol: Interlocking Educational Hub & Sprout Emblem -->
  <g filter="url(#softGlow)">
    <!-- Central Knowledge Book & Petal Base -->
    <path d="M160 350 C210 320, 245 328, 256 348 C267 328, 302 320, 352 350 C352 270, 302 240, 256 260 C210 240, 160 270, 160 350 Z" 
          fill="url(#accentGrad)" />

    <!-- Upward Growth Leaves (Mint) -->
    <path d="M256 240 C210 200, 200 130, 256 110 C240 160, 265 195, 256 240 Z" 
          fill="url(#mintGrad)" />
    <path d="M256 240 C302 200, 312 130, 256 110 C272 160, 247 195, 256 240 Z" 
          fill="url(#mintGrad)" opacity="0.85" />

    <!-- Central Node Star / Sparkle of Excellence -->
    <circle cx="256" cy="180" r="16" fill="#FAF7F2" />
    <circle cx="195" cy="225" r="10" fill="#B7E5CD" />
    <circle cx="317" cy="225" r="10" fill="#C1785A" />
  </g>

  <!-- Typography initials / subtle baseline branding -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FAF7F2" text-anchor="middle" letter-spacing="4">
    IMPACT HUB
  </text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#8ABEB9" text-anchor="middle" letter-spacing="2">
    EGYPT
  </text>
</svg>
